name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/portfolio
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Generate Prisma client
        run: pnpm --filter @portfolio/api db:generate
      - run: pnpm typecheck
      - run: pnpm build
